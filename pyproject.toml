[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-telegram"
version = "0.2.0"
description = "Spin up Claude Code with the official Telegram plugin in one command"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Travis Burmaster", email = "travis@burmaster.com" }]
keywords = ["claude", "claude-code", "telegram", "mcp", "ai", "assistant"]

dependencies = [
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "apscheduler>=3.10.0",
    "python-telegram-bot>=21.0",
    "pyyaml>=6.0.0",
    "bcrypt>=4.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
claude-telegram = "claude_telegram.cli:main"
claude-agent = "claude_agent_os.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_telegram", "src/claude_agent_os"]
